<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>digit portrait</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  body { -webkit-tap-highlight-color: transparent; }
  body.running { cursor: none; }
  canvas#stage { display: block; width: 100vw; height: 100vh; background: #000; }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000; transition: opacity .7s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #start {
    appearance: none; background: transparent; color: #e8e2d8;
    border: 1px solid #3a3a3a; border-radius: 2px;
    font: 500 13px/1 "Courier New", ui-monospace, monospace;
    letter-spacing: .34em; text-transform: uppercase;
    padding: 18px 34px 18px 40px; cursor: pointer;
    transition: color .25s ease, border-color .25s ease, background .25s ease;
  }
  #start:hover { color: #fff; border-color: #8a5fc2; background: rgba(138,95,194,.08); }
  #note {
    color: #2e2e2e; font: 400 11px/1.6 "Courier New", ui-monospace, monospace;
    letter-spacing: .28em; text-transform: uppercase; user-select: none;
  }

  /* ---- плавающий блок в правом верхнем углу ---- */
  #corner {
    position: fixed; top: 22px; right: 24px; z-index: 5;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    animation: float 6.5s ease-in-out infinite;
    opacity: 0; transition: opacity 1.1s ease;
    user-select: none; -webkit-user-select: none;
  }
  #corner.shown { opacity: 1; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  #corner a, #corner .vol { display: flex; align-items: center; gap: 9px; }
  #corner a { text-decoration: none; cursor: pointer; }
  #corner .nick {
    color: #55524c; font: 700 13px/1 "Courier New", ui-monospace, monospace;
    letter-spacing: .16em; transition: color .25s ease, text-shadow .25s ease;
    order: -1; text-shadow: 0 0 10px rgba(207, 198, 174, .18);
  }
  #corner a:hover .nick { text-shadow: 0 0 14px rgba(138, 95, 194, .45); }
  #corner a:hover .nick { color: #f1e6da; }
  #corner canvas { display: block; }
  #volIcon { cursor: pointer; }
  #volTrack { cursor: ew-resize; order: -1; padding: 9px 0; touch-action: none; }
  body.running #corner, body.running #corner * { cursor: pointer; }
  body.running #volTrack { cursor: ew-resize; }
  @media (max-width: 520px) {
    #corner { top: 14px; right: 14px; gap: 8px; }
    #corner .nick { font-size: 11px; letter-spacing: .12em; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="corner">
  <a id="lnkTg" href="https://t.me/kandalaza" target="_blank" rel="noopener noreferrer">
    <span class="nick">@kandalaza</span><canvas class="ic" data-icon="tg"></canvas>
  </a>
  <a id="lnkIg" href="https://instagram.com/kandalaza" target="_blank" rel="noopener noreferrer">
    <span class="nick">@kandalaza</span><canvas class="ic" data-icon="ig"></canvas>
  </a>
  <div class="vol">
    <canvas id="volTrack"></canvas><canvas id="volIcon" class="ic" data-icon="vol"></canvas>
  </div>
</div>

<audio id="track" loop preload="auto" playsinline></audio>

<div id="overlay"><button id="start">Запустить</button></div>

/* ------------------------------------------------------------------
   Анимированный портрет из падающих цифр.
   Форма и движение полностью взяты из исходного видео: каждый кадр
   разобран на 5 бинарных масок (волосы / кожа / свитер / комбинезон /
   ошейник), маски сведены в сетку ячеек 173 x 150 (одна ячейка =
   одна цифра). «Дождь» из цифр — только текстура заливки, силуэт на
   100% определяется масками кадра.
------------------------------------------------------------------- */

// цвета зон: 0 фон, 1 волосы, 2 кожа, 3 свитер, 4 комбинезон, 5 ошейник
const ZONE_COLORS = [null, '#8a5fc2', '#f1e6da', '#45474f', '#cfc6ae', '#ff2d55'];

// --- декодирование ---------------------------------------------------
const MAP = new Int16Array(128).fill(-1);
for (let i = 0; i < AL.length; i++) MAP[AL.charCodeAt(i)] = i;
const BASE = AL.length, CELLS = GW * GH;

function decodeFrame(s) {
  const out = new Uint8Array(CELLS);
  let p = 0, i = 0;
  while (i < s.length) {
    const v = MAP[s.charCodeAt(i++)];
    let z, n;
    if (v < NZONE * SINGLE) { z = (v / SINGLE) | 0; n = v % SINGLE + 1; }
    else { z = v - NZONE * SINGLE; n = MAP[s.charCodeAt(i++)] * BASE + MAP[s.charCodeAt(i++)]; }
    if (z) out.fill(z, p, p + n);
    p += n;
  }
  return out;
}

const FRAMES = RAW.split('\n').map(decodeFrame);

// --- детерминированный шум ------------------------------------------
function hash2(x, y) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}

// постоянные случайные величины: порог растворения ячейки и скорость колонки
const dissolve = new Float32Array(CELLS);
for (let i = 0; i < CELLS; i++) dissolve[i] = (hash2(i, 7919) % 1000) / 1000;
const colSpeed = new Float32Array(GW);
for (let c = 0; c < GW; c++) {
  colSpeed[c] = CFG.RAIN_MIN + (hash2(c, 104729) % 1000) / 1000 * (CFG.RAIN_MAX - CFG.RAIN_MIN);
}

// --- холст и атлас глифов -------------------------------------------
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });
const atlas = document.createElement('canvas');
const actx = atlas.getContext('2d');

let cell = 8, originX = 0, originY = 0, dpr = 1;
const LEVELS = [0.78, 1.0, 1.18];   // три уровня яркости «дождя»

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) * k));
  const g = Math.min(255, Math.round(((n >> 8) & 255) * k));
  const b = Math.min(255, Math.round((n & 255) * k));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function buildAtlas() {
  const nLv = CFG.TEXTURE > 0 ? LEVELS.length : 1;
  atlas.width = 10 * cell;
  atlas.height = (NZONE - 1) * nLv * cell;
  actx.clearRect(0, 0, atlas.width, atlas.height);
  actx.textAlign = 'center';
  actx.textBaseline = 'middle';
  actx.font = CFG.FONT_WEIGHT + ' ' + Math.max(5, Math.round(cell * CFG.FONT_SCALE)) + 'px ' + CFG.FONT;
  for (let z = 1; z < NZONE; z++) {
    for (let l = 0; l < nLv; l++) {
      const mix = CFG.TEXTURE > 0 ? 1 + (LEVELS[l] - 1) * (CFG.TEXTURE / 0.22) : 1;
      const row = (z - 1) * nLv + l;
      if (CFG.FILL > 0) {
        actx.globalAlpha = Math.min(1, CFG.FILL * (CFG.FILL_BY_ZONE[z] || 1) * mix);
        actx.fillStyle = ZONE_COLORS[z];
        actx.fillRect(0, row * cell, atlas.width, cell);
        actx.globalAlpha = 1;
      }
      actx.fillStyle = shade(ZONE_COLORS[z], mix);
      for (let d = 0; d < 10; d++) {
        actx.fillText(String(d), d * cell + cell / 2, row * cell + cell / 2 + cell * 0.04);
      }
    }
  }
}

function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const vw = window.innerWidth, vh = window.innerHeight;
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  // сетка всегда вписывается целиком, пропорции фигуры сохраняются
  let c = Math.min(canvas.width / GW, canvas.height / GH);
  c = Math.min(c, CFG.CELL_CSS_MAX * dpr);
  cell = Math.max(2, Math.floor(c));
  originX = Math.floor((canvas.width - cell * GW) / 2);
  originY = Math.floor((canvas.height - cell * GH) / 2);
  ctx.imageSmoothingEnabled = false;
  buildAtlas();
}

// --- отрисовка одного состояния -------------------------------------
const nLvRef = () => (CFG.TEXTURE > 0 ? LEVELS.length : 1);

function drawState(f0, f1, frac, time) {
  const A = FRAMES[f0], B = FRAMES[f1];
  const nLv = nLvRef();
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  let i = 0;
  for (let r = 0; r < GH; r++) {
    const y = originY + r * cell;
    if (y + cell < 0 || y > canvas.height) { i += GW; continue; }
    for (let c = 0; c < GW; c++, i++) {
      let z = A[i];
      const zb = B[i];
      if (z !== zb) z = dissolve[i] < frac ? zb : z;
      if (!z) continue;
      const phase = (r + time * colSpeed[c]) | 0;
      const h = hash2(c * 131 + 17, phase);
      const d = h % 10;
      const lv = nLv > 1 ? (h >>> 11) % nLv : 0;
      const row = (z - 1) * nLv + lv;
      ctx.drawImage(atlas, d * cell, row * cell, cell, cell,
                    originX + c * cell, y, cell, cell);
    }
  }
}

// --- цикл -------------------------------------------------------------
let running = false, elapsed = 0, last = 0;

function frame(now) {
  if (!running) return;
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  elapsed += dt;
  const t = elapsed * CFG.FPS;
  const fi = Math.floor(t);
  const f0 = ((fi % NF) + NF) % NF;
  const f1 = (f0 + 1) % NF;
  drawState(f0, f1, t - fi, elapsed);
  requestAnimationFrame(frame);
}

function start() {
  document.body.classList.add('running');
  running = true;
  elapsed = 0;
  last = performance.now();
  requestAnimationFrame(frame);
}

function drawStatic(idx) {
  drawState(idx, idx, 0, 0.0);
}

// --- управление показом ------------------------------------------------
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start');

function hideOverlay() {
  overlay.classList.add('hidden');
  setTimeout(() => { overlay.style.display = 'none'; }, 750);
}

function showMessage(text) {
  overlay.innerHTML = '<div id="note">' + text + '</div>';
}

let mode = 'button';
try {
  if (CFG.ONCE_ONLY && localStorage.getItem(CFG.STORAGE_KEY) === 'true'
      && CFG.REPLAY_MODE !== 'replay') {
    mode = CFG.REPLAY_MODE;
  }
} catch (e) { /* localStorage недоступен — показываем кнопку */ }

layout();

if (mode === 'frozen') {
  hideOverlay();
  document.body.classList.add('running');
  drawStatic(NF - 1);
} else if (mode === 'message') {
  showMessage(CFG.REPLAY_TEXT);
} else {
  startBtn.addEventListener('click', () => {
    try { localStorage.setItem(CFG.STORAGE_KEY, 'true'); } catch (e) {}
    hideOverlay();
    start();
    startMusic();
  }, { once: true });
}

window.addEventListener('resize', () => {
  layout();
  if (!running) { if (mode === 'frozen') drawStatic(NF - 1); }
});

// --- формы иконок рисуются в системе координат 24x24 ------------------
const SHAPES = {
  tg(x) {                                   // кружок с вырезанным самолётиком
    x.beginPath(); x.arc(12, 12, 11.6, 0, Math.PI * 2); x.fill();
    x.globalCompositeOperation = 'destination-out';
    x.beginPath();
    x.moveTo(4.6, 11.7); x.lineTo(19.2, 6.0); x.lineTo(16.6, 18.6);
    x.lineTo(12.4, 15.0); x.lineTo(10.2, 18.0); x.lineTo(9.9, 13.4);
    x.closePath(); x.fill();
    x.beginPath(); x.moveTo(10.2, 13.9); x.lineTo(17.4, 8.2);
    x.lineWidth = 0.9; x.stroke();
    x.globalCompositeOperation = 'source-over';
  },
  ig(x) {                                   // камера: рамка + объектив + точка
    x.lineWidth = 2.7; x.lineJoin = 'round';
    x.beginPath();
    if (x.roundRect) x.roundRect(2.6, 2.6, 18.8, 18.8, 5.6);
    else x.rect(2.6, 2.6, 18.8, 18.8);
    x.stroke();
    x.beginPath(); x.arc(12, 12, 5.0, 0, Math.PI * 2); x.lineWidth = 2.5; x.stroke();
    x.beginPath(); x.arc(17.3, 6.7, 1.45, 0, Math.PI * 2); x.fill();
  },
  vol(x) {                                  // динамик + волны (или крест)
    x.beginPath();
    x.moveTo(2.5, 9.2); x.lineTo(6.6, 9.2); x.lineTo(11.0, 4.6);
    x.lineTo(11.0, 19.4); x.lineTo(6.6, 14.8); x.lineTo(2.5, 14.8);
    x.closePath(); x.fill();
    x.lineWidth = 1.9; x.lineCap = 'round';
    if (volume > 0.001) {
      x.beginPath(); x.arc(11.6, 12, 4.4, -0.85, 0.85); x.stroke();
      if (volume > 0.45) { x.beginPath(); x.arc(11.6, 12, 7.8, -0.85, 0.85); x.stroke(); }
      if (volume > 0.8)  { x.beginPath(); x.arc(11.6, 12, 11.0, -0.85, 0.85); x.stroke(); }
    } else {
      x.beginPath();
      x.moveTo(14.4, 8.6); x.lineTo(21.2, 15.4);
      x.moveTo(21.2, 8.6); x.lineTo(14.4, 15.4);
      x.stroke();
    }
  }
};

function buildMask(name, n) {
  const c = document.createElement('canvas');
  c.width = c.height = n * 4;               // рисуем крупно и ужимаем
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.strokeStyle = '#fff';
  x.scale(c.width / 24, c.height / 24);
  SHAPES[name](x);
  const s = document.createElement('canvas');
  s.width = s.height = n;
  const sx = s.getContext('2d');
  sx.drawImage(c, 0, 0, n, n);
  const d = sx.getImageData(0, 0, n, n).data;
  const m = new Uint8Array(n * n);
  for (let i = 0; i < n * n; i++) m[i] = d[i * 4 + 3] > 96 ? 1 : 0;
  return m;
}

let volume = UI.START_VOL;
try {
  const v = parseFloat(localStorage.getItem(UI.VOL_KEY));
  if (!isNaN(v)) volume = Math.min(1, Math.max(0, v));
} catch (e) {}

document.querySelectorAll('#corner canvas.ic').forEach(cv => {
  const name = cv.dataset.icon;
  const n = UI.ICON_N;
  const d = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = (n * UI.ICON_CELL) + 'px';
  cv.style.height = (n * UI.ICON_CELL) + 'px';
  cv.width = Math.round(n * UI.ICON_CELL * d);
  cv.height = Math.round(n * UI.ICON_CELL * d);
  icons.push({ cv, ctx: cv.getContext('2d'), name, n, hover: false,
               mask: buildMask(name, n), dpr: d });
});
document.querySelectorAll('#corner a').forEach(a => {
  a.addEventListener('pointerenter', () => icons.forEach(i => { if (a.contains(i.cv)) i.hover = true; }));
  a.addEventListener('pointerleave', () => icons.forEach(i => { if (a.contains(i.cv)) i.hover = false; }));
});

const volTrack = document.getElementById('volTrack');
const vtx = volTrack.getContext('2d');
{
  const d = Math.min(window.devicePixelRatio || 1, 3);
  volTrack.style.width = (UI.TRACK_W * UI.ICON_CELL) + 'px';
  volTrack.style.height = (UI.TRACK_H * UI.ICON_CELL) + 'px';
  volTrack.width = Math.round(UI.TRACK_W * UI.ICON_CELL * d);
  volTrack.height = Math.round(UI.TRACK_H * UI.ICON_CELL * d);
  volTrack.dataset.dpr = d;
}

function drawDigits(ctx, cells, cols, rows, cellPx, color, tick, dim) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = CFG.FONT_WEIGHT + ' ' + Math.max(5, Math.round(cellPx * 1.2)) + 'px ' + CFG.FONT;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = cells[r * cols + c];
      if (!v) continue;
      const h = hash2(c * 73 + r * 19 + 5, tick + r);
      ctx.fillStyle = v === 2 ? dim : color;
      ctx.globalAlpha = v === 2 ? 0.5 : 0.92;
      ctx.fillText(String(h % 10), c * cellPx + cellPx / 2, r * cellPx + cellPx / 2);
    }
  }
  ctx.globalAlpha = 1;
}

function drawWidget(tick) {
  for (const ic of icons) {
    if (ic.name === 'vol') {                      // форма зависит от громкости
      const st = volume <= 0.001 ? 0 : volume > 0.8 ? 3 : volume > 0.45 ? 2 : 1;
      if (ic.state !== st) { ic.state = st; ic.mask = buildMask('vol', ic.n); }
    }
    const cellPx = UI.ICON_CELL * ic.dpr;
    ic.ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawDigits(ic.ctx, ic.mask, ic.n, ic.n, cellPx,
               ic.hover ? UI.COLOR_HOVER : UI.COLOR, tick, UI.COLOR_DIM);
  }
  // ползунок
  const dpr = parseFloat(volTrack.dataset.dpr);
  const cells = new Uint8Array(UI.TRACK_W * UI.TRACK_H);
  const filled = Math.round(volume * UI.TRACK_W);
  for (let r = 0; r < UI.TRACK_H; r++) {
    for (let c = 0; c < UI.TRACK_W; c++) {
      const mid = r === (UI.TRACK_H >> 1);
      const handle = c === Math.min(UI.TRACK_W - 1, Math.max(0, filled - 1));
      cells[r * UI.TRACK_W + c] = (c < filled && (mid || handle || r > 0 && r < UI.TRACK_H - 1))
        ? 1 : (mid ? 2 : 0);
    }
  }
  drawDigits(vtx, cells, UI.TRACK_W, UI.TRACK_H, UI.ICON_CELL * dpr,
             UI.COLOR, tick + 3, UI.COLOR_DIM);
}

// --- управление громкостью ------------------------------------------
let musicStarted = false;
function applyVolume() {
  audio.volume = volume;
  audio.muted = volume <= 0.001;
  try { localStorage.setItem(UI.VOL_KEY, String(volume)); } catch (e) {}
}
function startMusic() {
  if (musicStarted) return;
  applyVolume();
  const p = audio.play();
  if (p && p.catch) p.catch(() => { musicStarted = false; });
  musicStarted = true;
}
applyVolume();

let lastVol = volume || UI.START_VOL;
document.getElementById('volIcon').addEventListener('click', (e) => {
  e.preventDefault();
  if (volume > 0.001) { lastVol = volume; volume = 0; }
  else volume = lastVol || UI.START_VOL;
  applyVolume(); startMusic();
});

function setVolFromEvent(e) {
  const r = volTrack.getBoundingClientRect();
  volume = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  applyVolume(); startMusic();
}
let dragging = false;
volTrack.addEventListener('pointerdown', e => {
  dragging = true; volTrack.setPointerCapture(e.pointerId); setVolFromEvent(e);
});
volTrack.addEventListener('pointermove', e => { if (dragging) setVolFromEvent(e); });
volTrack.addEventListener('pointerup', () => { dragging = false; });
volTrack.addEventListener('pointercancel', () => { dragging = false; });

// первый клик/касание по странице разблокирует звук (политика браузеров)
['pointerdown', 'keydown'].forEach(ev =>
  window.addEventListener(ev, () => startMusic(), { once: true }));

// --- собственный цикл угла (работает и без анимации портрета) --------
const corner = document.getElementById('corner');
let wTick = -1;
function widgetLoop(now) {
  const tick = Math.floor(now / 1000 * UI.FLICKER);
  if (tick !== wTick) { wTick = tick; drawWidget(tick); }
  requestAnimationFrame(widgetLoop);
}
requestAnimationFrame(widgetLoop);
setTimeout(() => corner.classList.add('shown'), 400);

// сброс флага для тестирования: resetDigitPortrait() в консоли
window.resetDigitPortrait = function () {
  try { localStorage.removeItem(CFG.STORAGE_KEY); } catch (e) {}
  location.reload();
};
console.log('%cresetDigitPortrait() — сбросить флаг однократного показа',
            'color:#8a5fc2;font:12px monospace');
</script>
